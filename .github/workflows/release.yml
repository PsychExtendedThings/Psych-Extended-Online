name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib
          
          # Install standard libs
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxvlc --quiet
          haxelib install tjson --quiet
          haxelib install discord_rpc --quiet
          
          # Force Git to use the Token for ALL requests to prevent the 'Username' hang
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

          echo "Installing Custom Repos..."
          haxelib git mobile-controls https://github.com/MAJigsaw77/mobile-controls --quiet
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit --quiet
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec --quiet
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools --quiet

          echo "Finalizing Android SDK..."
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
        shell: bash

      - name: Compile APK
        run: |
          echo "Starting the long C++ build for RedMagic Astra..."
          haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-v${{ github.run_number }}"
          name: "Psych Online Android Build #${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
