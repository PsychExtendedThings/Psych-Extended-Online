name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # This kills the "Password" prompt forever
      GIT_TERMINAL_PROMPT: 0
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          set -x # This makes the server show you EVERY command it runs
          
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-addons 3.0.2
          haxelib install flixel-ui
          haxelib install flixel-tools
          haxelib install hxvlc
          haxelib install tjson
          haxelib install discord_rpc

          # Use the official 'x-access-token' method for the clones
          # This provides the "Read/Write" access you asked for
          TOKEN_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com"
          
          mkdir -p ~/deps
          
          echo "Cloning linc_luajit..."
          git clone --depth 1 $TOKEN_URL/jigsaw-4277821/linc_luajit ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          
          echo "Cloning hxCodec..."
          git clone --depth 1 $TOKEN_URL/polybiusproxy/hxCodec ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          
          echo "Cloning extension-androidtools..."
          git clone --depth 1 $TOKEN_URL/jigsaw-4277821/extension-androidtools ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
        shell: bash

      - name: Compile APK
        run: |
          # The background work starts here!
          haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-android-${{ github.run_number }}"
          name: "Psych Online Android Build #${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
