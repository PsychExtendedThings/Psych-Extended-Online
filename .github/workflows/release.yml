name: Android Build Compiler Psych Online

on: 
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  Build:
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: Android-NORMAL
            os: ubuntu-latest
            setupCommand: sh ./setup/unix-alter.sh
            buildArgs: "android -ONLY_ARM64 -final" 
            artifactName: androidBuild-Astra
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
            doCache: "YES" # Added this back

          - name: Windows-NORMAL
            os: windows-latest
            setupCommand: "setup/windows.bat"
            buildArgs: "windows -D officialBuild -final"
            artifactName: windowsBuild-x86_64
            artifactPath: "export/release/windows/bin/*.exe"
            doCache: "YES" # Added this back

    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      setupCommand: ${{ matrix.setupCommand }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      doCache: ${{ matrix.doCache }} # Passing the input here
    secrets: inherit

  Release:
    needs: Build
    if: ${{ always() && contains(needs.Build.result, 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./outputs
          merge-multiple: true 

      - name: Organize Files
        run: |
          mkdir -p release_dist
          find ./outputs -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} ./release_dist/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Android Build Compiler Psych Online #${{ github.run_number }}"
          body: |
            ## 🚀 Psych Online Extended: Automated Build
            - **Platform:** Android (Astra) / Windows
            - **Build Number:** ${{ github.run_number }}
          files: release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
