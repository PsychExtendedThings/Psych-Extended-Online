name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          set -e
          # FORCE all git commands to use the runner's token for zero-auth errors
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
          haxelib setup ~/haxelib
          
          echo "--- 1. Base Frameworks ---"
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install tjson --quiet
          haxelib install discord_rpc --quiet
          haxelib install hxvlc --quiet

          echo "--- 2. Scripting & Visuals (Fixed URLs) ---"
          # SScript for Psych 0.7+ and Extended
          haxelib git SScript https://github.com/Oren-LuckyJackpots/SScript-For-Psych --quiet
          # Official hscript-improved for Codename/Psych integration
          haxelib git hscript-improved https://github.com/CodenameCrew/hscript-improved --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate --quiet
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis --quiet

          echo "--- 3. Porting & Tools ---"
          mkdir -p ~/deps
          git clone --depth 1 https://github.com/ArkoseLabsOfficial/mobile-controls ~/deps/mobile-controls
          haxelib dev mobile-controls ~/deps/mobile-controls

          git clone --depth 1 https://github.com/AndreiRudenko/linc_luajit ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          
          git clone --depth 1 https://github.com/polybiusproxy/hxCodec ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          
          git clone --depth 1 https://github.com/MAJigsaw77/extension-androidtools ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          echo "--- 4. Final System Config ---"
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
        shell: bash

      - name: Compile APK
        run: |
          echo "Compiling for RedMagic Astra... Grab a coffee, this will take 20+ mins."
          haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-v${{ github.run_number }}"
          name: "Psych Online Extended Build #${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
