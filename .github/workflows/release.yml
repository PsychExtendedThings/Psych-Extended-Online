name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install All Dependencies (High-Reliability Mode)
        run: |
          set -e
          haxelib setup ~/haxelib
          
          echo "--- 1. Base Frameworks ---"
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxvlc --quiet
          
          echo "--- 2. Data & Logic ---"
          haxelib install tjson --quiet
          haxelib install json2object --quiet
          haxelib install hscript --quiet
          haxelib install compiletime --quiet
          haxelib install systools --quiet
          haxelib install actuate --quiet
          haxelib install thx.core --quiet
          haxelib install thx.semver --quiet
          haxelib install yaml --quiet
          haxelib install markdown --quiet
          haxelib install hxGeomAlgo --quiet
          
          echo "--- 3. Online & Networking ---"
          haxelib install colyseus --quiet
          haxelib install colyseus-websocket --quiet
          haxelib install tink_core --quiet
          haxelib install tink_http --quiet
          haxelib install tink_url --quiet
          haxelib install tink_web --quiet
          haxelib install http-status --quiet
          haxelib install HtmlParser --quiet

          echo "--- 4. Heavy-Duty Git Clones (Bypassing Haxelib) ---"
          mkdir -p ~/deps
          
          # Manually forcing every library that has failed so far
          git clone --depth 1 https://github.com/larsiusprime/hx-lua.git ~/deps/hx-lua
          haxelib dev hx-lua ~/deps/hx-lua
          
          git clone --depth 1 https://github.com/Oren-LuckyJackpots/SScript-For-Psych.git ~/deps/SScript
          haxelib dev SScript ~/deps/SScript
          
          git clone --depth 1 https://github.com/CodenameCrew/hscript-improved.git ~/deps/hscript-improved
          haxelib dev hscript-improved ~/deps/hscript-improved
          
          git clone --depth 1 https://github.com/Dot-Stuff/flxanimate.git ~/deps/flxanimate
          haxelib dev flxanimate ~/deps/flxanimate
          
          git clone --depth 1 https://github.com/grig-org/grig.core.git ~/deps/grig-core
          haxelib dev grig.core ~/deps/grig-core
          
          git clone --depth 1 https://github.com/grig-org/grig.audio.git ~/deps/grig-audio
          haxelib dev grig.audio ~/deps/grig-audio

          git clone --depth 1 https://github.com/ArkoseLabsOfficial/mobile-controls.git ~/deps/mobile-controls
          haxelib dev mobile-controls ~/deps/mobile-controls
          
          git clone --depth 1 https://github.com/AndreiRudenko/linc_luajit.git ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          
          git clone --depth 1 https://github.com/polybiusproxy/hxCodec.git ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          
          git clone --depth 1 https://github.com/MAJigsaw77/extension-androidtools.git ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          echo "--- 5. Finalizing Environment ---"
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
        shell: bash

      - name: Compile APK (Final Build)
        run: |
          echo "Building for RedMagic Astra..."
          echo "::group::Compiler Output"
          haxelib run lime build android -final -quiet
          echo "::endgroup::"
        shell: bash

      - name: Find and Upload APK
        run: |
          mkdir -p output
          find export/ -name "*.apk" -exec cp {} output/ \;
          # Error check: If no APK found, list everything to see what happened
          if [ -z "$(ls -A output)" ]; then 
            echo "No APK found! Printing export directory for debug:"
            ls -R export/
            exit 1
          fi
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-v${{ github.run_number }}"
          name: "Psych Online Extended Build #${{ github.run_number }}"
          files: output/*.apk
