name: Build + Release
on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches: [ "main" ] # Triggers on push to main
    tags:
      - 'v*' # Triggers when you create a tag (e.g., v1.0)

jobs:
  buildWindows:
    runs-on: windows-latest
    permissions:
      contents: write # CRITICAL: Allows the action to create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # Essential for Psych Engine dependencies

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-addons 3.0.2
          haxelib install flixel-ui
          haxelib install hxvlc
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib run lime setup
        shell: pwsh

      - name: Compile
        run: haxelib run lime build windows -release -D HXCPP_CHECK_POINTER
        # -D HXCPP_CHECK_POINTER helps prevent silent crashes during C++ linking

      - name: Zip Build
        run: |
          cd export/release/windows/bin
          7z a ../../../../PsychOnline-Windows.zip *
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Psych Online Extended Build"
          tag_name: "latest-build"
          files: PsychOnline-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
