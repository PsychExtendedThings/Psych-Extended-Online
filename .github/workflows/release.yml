name: Build Psych Extended Online

on: 
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android-NORMAL
            os: ubuntu-latest
            setupCommand: sh ./setup/unix-alter.sh
            buildArgs: "android -ONLY_ARM64 -final" 
            artifactName: androidBuild-Astra
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
            doCache: "YES"

          - name: Windows-NORMAL
            os: windows-latest
            setupCommand: "setup/windows.bat"
            buildArgs: "windows -D officialBuild -final"
            artifactName: windowsBuild-x86_64
            artifactPath: "export/release/windows/bin/*"
            doCache: "YES"

    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      setupCommand: ${{ matrix.setupCommand }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      doCache: ${{ matrix.doCache }}
    secrets: inherit

  Release:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./outputs

      - name: Organize Files
        run: |
          mkdir -p release_dist
          # Find all APKs and EXEs and move them to a flat folder
          find ./outputs -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} ./release_dist/ \;
          ls -R ./release_dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Psych Online Extended Build #${{ github.run_number }}"
          body: |
            ## 🚀 Automated Build for RedMagic Astra & Windows
            - **Run Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            
            This release was automatically generated by GitHub Actions.
          files: release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
