name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Kills any hidden password/username prompts
      GIT_TERMINAL_PROMPT: 0
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          set -x # Background Transparency: Shows every command being run
          
          echo "Setting up Haxelib..."
          haxelib setup ~/haxelib
          
          echo "Installing Base Libraries..."
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxvlc --quiet
          haxelib install tjson --quiet
          haxelib install discord_rpc --quiet

          echo "Fetching Corrected Android Dependencies..."
          mkdir -p ~/deps
          
          # FIX: Corrected URL for linc_luajit
          git clone --depth 1 https://github.com/jigsaw-4277821/linc_luajit-nebulazorua ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          
          # Standard hxCodec for video support
          git clone --depth 1 https://github.com/polybiusproxy/hxCodec ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          
          # Most stable version of Android Tools
          git clone --depth 1 https://github.com/MAJigsaw77/extension-androidtools ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          echo "Linking Android SDK..."
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
        shell: bash

      - name: Compile APK
        run: |
          echo "Starting C++ Compilation for RedMagic Astra..."
          haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-v${{ github.run_number }}"
          name: "Psych Online Android Build #${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
