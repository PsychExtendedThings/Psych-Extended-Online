name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Absolute prompt killer - prevents background hangs
      GIT_TERMINAL_PROMPT: 0
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          set -e
          echo "--- Setting up Haxelib ---"
          haxelib setup ~/haxelib
          
          echo "--- Installing Standard Libraries ---"
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxvlc --quiet
          haxelib install tjson --quiet
          haxelib install discord_rpc --quiet
          
          echo "--- Cloning Custom Libraries (Safe Mode) ---"
          mkdir -p ~/deps
          
          # Using --quiet to prevent log bloat and --depth 1 for speed
          echo "Cloning: mobile-controls..."
          git clone --quiet --depth 1 https://github.com/MAJigsaw77/mobile-controls ~/deps/mobile-controls
          haxelib dev mobile-controls ~/deps/mobile-controls

          echo "Cloning: linc_luajit..."
          git clone --quiet --depth 1 https://github.com/AndreiRudenko/linc_luajit ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          
          echo "Cloning: hxCodec..."
          git clone --quiet --depth 1 https://github.com/polybiusproxy/hxCodec ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          
          echo "Cloning: extension-androidtools..."
          git clone --quiet --depth 1 https://github.com/MAJigsaw77/extension-androidtools ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          echo "--- Finalizing Android SDK ---"
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
          echo "Ready for compilation!"
        shell: bash

      - name: Compile APK
        run: |
          echo "Compiling for RedMagic Astra... this will take some time."
          haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-build-${{ github.run_number }}"
          name: "Psych Online Android Build #${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
