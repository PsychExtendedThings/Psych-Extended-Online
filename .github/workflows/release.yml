name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install All Dependencies
        run: |
          echo "::group::Installing Dependencies"
          set -e
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          haxelib setup ~/haxelib
          
          # Frameworks
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxvlc --quiet
          
          # Networking & Data
          haxelib install tjson --quiet
          haxelib install json2object --quiet
          haxelib install tink_core --quiet
          haxelib install tink_http --quiet
          haxelib install tink_url --quiet
          haxelib install tink_web --quiet
          haxelib install http-status --quiet
          haxelib install thx.core --quiet
          haxelib install thx.semver --quiet
          haxelib install colyseus --quiet
          haxelib install colyseus-websocket --quiet
          haxelib install HtmlParser --quiet
          haxelib install yaml --quiet
          haxelib install markdown --quiet
          
          # Scripting & Utilities
          haxelib install lumod --quiet
          haxelib install away3d --quiet
          haxelib install systools --quiet
          haxelib install actuate --quiet
          haxelib install discord_rpc --quiet
          haxelib install hscript --quiet
          haxelib install hscript-ex --quiet
          haxelib install hx-lua --quiet
          haxelib install compiletime --quiet
          haxelib install vector-math --quiet

          # Git-Direct Installs (Bypassing Haxelib Server Errors)
          haxelib git hxGeomAlgo https://github.com/azrafe7/hxGeomAlgo.git --quiet
          haxelib git grig.core https://github.com/grig-org/grig.core.git --quiet
          haxelib git grig.audio https://github.com/grig-org/grig.audio.git --quiet
          haxelib git linc_stb https://github.com/snowkit/linc_stb.git --quiet
          haxelib git SScript https://github.com/Oren-LuckyJackpots/SScript-For-Psych --quiet
          haxelib git hscript-improved https://github.com/CodenameCrew/hscript-improved --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate --quiet
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis --quiet
          haxelib git UnRAR https://github.com/Snirozu/Haxe-UnRAR --quiet

          # Mobile/Native Repos
          mkdir -p ~/deps
          git clone --depth 1 https://github.com/ArkoseLabsOfficial/mobile-controls ~/deps/mobile-controls
          haxelib dev mobile-controls ~/deps/mobile-controls
          git clone --depth 1 https://github.com/AndreiRudenko/linc_luajit ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          git clone --depth 1 https://github.com/polybiusproxy/hxCodec ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          git clone --depth 1 https://github.com/MAJigsaw77/extension-androidtools ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
          echo "::endgroup::"
        shell: bash

      - name: Compile APK
        run: |
          echo "::group::Compiler Output"
          haxelib run lime build android -final -quiet
          echo "::endgroup::"
        shell: bash

      - name: Find and Upload APK
        run: |
          mkdir -p output
          find export/ -name "*.apk" -exec cp {} output/ \;
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-v${{ github.run_number }}"
          name: "Psych Online Extended Build #${{ github.run_number }}"
          files: output/*.apk
