name: Build

on:
  workflow_call:
    inputs:
      name: { required: true, type: string }
      os: { required: true, type: string }
      setupCommand: { required: true, type: string }
      buildArgs: { required: true, type: string }
      artifactName: { required: true, type: string }
      artifactPath: { required: true, type: string }
      doCache: { required: true, type: string }

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          # Execute the setup command (e.g., unix-alter.sh)
          ${{ inputs.setupCommand }}
          
          # CRITICAL: This "wakes up" lime so it doesn't crash silently
          haxelib run lime setup -noprompt
          
          # Android-only pathing (fixes the silent target error)
          if [ "${{ runner.os }}" = "Linux" ]; then
            haxelib run lime config ANDROID_SDK $ANDROID_HOME
            haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          fi
        shell: bash

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}

      - name: Release APK
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Psych Online Build #${{ github.run_number }}"
          files: ${{ inputs.artifactPath }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
