name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      doCache:
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: write # CRITICAL: Allows GitHub to post files to your Releases page
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4 # Fixes the "Unexpected ?" error in Main.hx

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          ${{ inputs.setupCommand }}
          
          # Fixes the "lime setup android" error for the Android runner
          if [ "${{ runner.os }}" = "Linux" ]; then
            haxelib run lime config ANDROID_SDK $ANDROID_HOME
            haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
            haxelib run lime setup android -noprompt
          fi
        shell: bash

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}
        shell: bash

      # Packs the Windows executable + assets + .dll files into a neat .zip archive
      - name: Package Windows Build (.zip)
        if: runner.os == 'Windows'
        run: |
          cd export/release/windows/bin
          Compress-Archive -Path * -DestinationPath ../../../../PsychOnline-Windows.zip
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}

      # The Releaser: Posts either your APK or Windows ZIP automatically to your repo page
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Psych Online Build #${{ github.run_number }}"
          body: "Automated compilation build for ${{ inputs.name }}"
          files: |
            export/release/android/bin/app/build/outputs/apk/release/*.apk
            PsychOnline-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
