name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      doCache:
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: write # Required for the release feature
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Libraries & Fix "Enemies"
        run: |
          haxelib setup ~/haxelib
          # 1. Run original setup
          ${{ inputs.setupCommand }}
          
          # 2. FEATURE: Force-fix libraries that cause the '128' error
          mkdir -p ~/deps
          git clone --depth 1 https://github.com/HaxeFoundation/hx-lua ~/deps/hx-lua || true
          haxelib dev hx-lua ~/deps/hx-lua || true
          git clone --depth 1 https://github.com/azrafe7/hxGeomAlgo ~/deps/hxGeomAlgo || true
          haxelib dev hxGeomAlgo ~/deps/hxGeomAlgo || true
          
          # 3. FEATURE: Android Environment Setup (Only if on Linux)
          if [ "${{ runner.os }}" = "Linux" ]; then
            haxelib run lime setup android
            haxelib run lime config ANDROID_SDK $ANDROID_HOME
            haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          fi
        shell: bash

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}

      # FEATURE: Auto-Release (Posts the file to GitHub immediately after building)
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Android Build Compiler Psych Online #${{ github.run_number }}"
          body: |
            ## 🚀 Automated Build: ${{ inputs.name }}
            - Build Run: ${{ github.run_number }}
            - Target OS: ${{ inputs.os }}
          files: ${{ inputs.artifactPath }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
